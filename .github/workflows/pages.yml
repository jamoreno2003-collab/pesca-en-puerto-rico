name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Habilitar y preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Crear artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
